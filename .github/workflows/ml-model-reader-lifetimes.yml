name: ML model reader lifetimes
on:
  pull_request:
    paths:
      - 'backend/ml/app/models/base.py'
      - 'backend/ml/tests/test_model_reader_lifetimes.py'
      - '.github/workflows/ml-model-reader-lifetimes.yml'
permissions:
  contents: read
jobs:
  generation-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: backend/ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest==9.1.1 fastapi==0.142.2 ruff==0.16.9
      - name: Analyze new lifetime regressions
        run: python -m ruff check backend/ml/tests/test_model_reader_lifetimes.py
      - name: Verify native reader and publication lifetimes
        run: python -m pytest -q backend/ml/tests/test_model_reader_lifetimes.py
