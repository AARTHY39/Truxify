name: Native PCGrad parameter layout
on:
  pull_request:
    paths:
      - 'backend/ml/mtl/model.py'
      - 'backend/ml/tests/test_pcgrad_parameter_layout.py'
      - '.github/workflows/pcgrad-parameter-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gradients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 pytest==9.0.3 ruff==0.16.9
      - name: Native full-coordinate gradient references
        env:
          PYTHONPATH: backend/ml
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q backend/ml/tests/test_pcgrad_parameter_layout.py backend/ml/tests/test_mtl.py -k 'not test_mtl_init'
      - name: Scoped analysis
        run: python -m ruff check backend/ml/mtl/model.py backend/ml/tests/test_pcgrad_parameter_layout.py --select E9,F63,F7,F82
